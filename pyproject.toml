[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-version-hook"
version = "0.1.0"
description = "Git pre-commit hook that bumps a version in a YAML file based on the branch name"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=5.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.8",
]

[project.scripts]
auto-version-hook = "auto_version_hook.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
# Real errors (pyflakes + pycodestyle subset) and import sorting.
# The pyupgrade (UP) family is deliberately off: mass annotation
# modernization is not worth the churn for a 3.9+ codebase.
select = ["E4", "E7", "E9", "F", "I"]
