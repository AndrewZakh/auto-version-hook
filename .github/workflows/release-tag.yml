# On every push to main: read the version from env.yml and tag the release.
# Idempotent by design — if the tag already exists, the run exits quietly:
# versions are monotonic (auto-version-hook never downgrades), so a version
# seen on main once is already released, and merges that do not change the
# version are skipped.

name: release-tag

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      force:
        description: 'Skip the gap guard (tag a version that skips increments)'
        type: boolean
        default: false

permissions:
  contents: write   # push the tag

concurrency:
  group: release-tag
  cancel-in-progress: false   # serialize rapid merges

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml
      - name: Read version from env.yml
        id: version
        run: echo "version=$(python -c 'import yaml; print(yaml.safe_load(open("env.yml"))["version"])')" >> "$GITHUB_OUTPUT"
      - name: Gap guard
        env:
          VERSION: ${{ steps.version.outputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ -n "$(git ls-remote --tags origin "refs/tags/$VERSION")" ]; then
            echo "tag $VERSION already exists — nothing to do"
            exit 0
          fi
          if [ "$FORCE" = "true" ]; then
            echo "force run: skipping the gap guard"
            exit 0
          fi
          PREV=$(git ls-remote --tags origin 'refs/tags/v*' | sed 's/.*refs\/tags\///' | grep -v '\^{}' | sort -V | tail -1)
          if [ -z "$PREV" ]; then
            echo "first release: no previous tag to compare against"
            exit 0
          fi
          python - "$PREV" "$VERSION" <<'PY'
          import sys

          def semver(tag):
              return tuple(int(p) for p in tag.lstrip("v").split("."))

          prev, new = semver(sys.argv[1]), semver(sys.argv[2])
          if len(prev) != 3 or len(new) != 3:
              print(f"gap guard: cannot compare {new} with {prev} (expected v<major>.<minor>.<patch>)")
              sys.exit(1)
          allowed = {
              (prev[0] + 1, 0, 0),
              (prev[0], prev[1] + 1, 0),
              (prev[0], prev[1], prev[2] + 1),
          }
          if new not in allowed:
              allowed_str = ", ".join("v{}.{}.{}".format(*a) for a in sorted(allowed))
              print(
                  f"gap guard: v{new[0]}.{new[1]}.{new[2]} skips versions after "
                  f"v{prev[0]}.{prev[1]}.{prev[2]}; allowed next: {allowed_str}. "
                  f"Intentional jump? Run this workflow manually with force=true."
              )
              sys.exit(1)
          PY
      - name: Tag the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "release-bot"
          git config user.email "actions@users.noreply.github.com"
          git tag -a "$VERSION" -m "release $VERSION"
          git push origin "refs/tags/$VERSION"
          # roll the "latest" tag for pre-commit consumers (rev: latest);
          # skipped above when no new release happened — latest then already
          # points at the newest release
          git tag -f latest
          git push -f origin refs/tags/latest
